# ═══════════════════════════════════════════════════════════════════════════════
#  NuRichter · lowlighter/metrics · GitHub Actions Workflow
#  Generates SVG infographics and commits them to main branch.
#
#  FILE LOCATION: .github/workflows/metrics.yml
#
#  SETUP (one-time):
#  ┌─────────────────────────────────────────────────────────────────────────┐
#  │  1. Create a GitHub PAT (classic) → https://github.com/settings/tokens │
#  │     Required scopes: [repo] [read:user]                                │
#  │  2. Repo → Settings → Secrets and variables → Actions                  │
#  │     Add secret: METRICS_TOKEN = <your PAT>                             │
#  │  3. Replace NuRichter with your AniList login below         │
#  │  4. Push this file to .github/workflows/metrics.yml on main            │
#  │  5. Go to Actions tab → "NuRichter Metrics" → Run workflow             │
#  └─────────────────────────────────────────────────────────────────────────┘
# ═══════════════════════════════════════════════════════════════════════════════

name: NuRichter Metrics

on:
  schedule:
    # once daily at 00:00 WIB (17:00 UTC previous day)
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # ────────────────────────────────────────────────────────────────────
      #  Achievements
      # ────────────────────────────────────────────────────────────────────
      - name: Achievements
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/metrics.achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B

      # ────────────────────────────────────────────────────────────────────
      #  Languages · In-Depth + Recently Used
      # ────────────────────────────────────────────────────────────────────
      - name: Languages Activity
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: lines, bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 30
          plugin_languages_analysis_timeout_repositories: 10

      # ────────────────────────────────────────────────────────────────────
      #  Star Lists · Repos + Languages
      # ────────────────────────────────────────────────────────────────────
      - name: Star Lists
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/metrics.starlists.svg
          token: NOT_NEEDED
          base: ""
          plugin_starlists: yes
          plugin_starlists_limit: 3
          plugin_starlists_limit_repositories: 2
          plugin_starlists_languages: yes
          plugin_starlists_limit_languages: 8
          plugin_starlists_shuffle_repositories: no

      # ────────────────────────────────────────────────────────────────────
      #  AniList · Anime (favorites + watching)
      #  GANTI NuRichter DI SEMUA STEP ANILIST
      # ────────────────────────────────────────────────────────────────────
      - name: AniList · Anime
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/metrics.anilist.anime.svg
          token: NOT_NEEDED
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: NuRichter
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites, watching
          plugin_anilist_limit: 2
          plugin_anilist_shuffle: yes

      # ────────────────────────────────────────────────────────────────────
      #  AniList · Manga (favorites + reading)
      # ────────────────────────────────────────────────────────────────────
      - name: AniList · Manga
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/metrics.anilist.manga.svg
          token: NOT_NEEDED
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: NuRichter
          plugin_anilist_medias: manga
          plugin_anilist_sections: favorites, reading
          plugin_anilist_limit: 2
          plugin_anilist_shuffle: yes

      # ────────────────────────────────────────────────────────────────────
      #  AniList · Husbando Shelf (characters batch A · shuffled)
      # ────────────────────────────────────────────────────────────────────
      - name: AniList · Husbando Shelf
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/metrics.anilist.husbando.svg
          token: NOT_NEEDED
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: NuRichter
          plugin_anilist_sections: characters
          plugin_anilist_limit_characters: 11
          plugin_anilist_shuffle: yes

      # ────────────────────────────────────────────────────────────────────
      #  AniList · Waifu Shelf (characters batch B · shuffled)
      # ────────────────────────────────────────────────────────────────────
      - name: AniList · Waifu Shelf
        if: ${{ success() || failure() }}
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics/metrics.anilist.waifu.svg
          token: NOT_NEEDED
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: NuRichter
          plugin_anilist_sections: characters
          plugin_anilist_limit_characters: 11
          plugin_anilist_shuffle: yes
