# ═══════════════════════════════════════════════════════════════
#   NuRichter · GitHub Cartography · Metrics Generator
#   Runs every 6h + on push to main
#   Generates SVGs → assets/metrics/  → README embeds them
#   Requires: METRICS_TOKEN secret (PAT with read:user, repo)
# ═══════════════════════════════════════════════════════════════

name: "GitHub Cartography · Metrics"

on:
  schedule:
    - cron: "0 */6 * * *"          # every 6 hours
  workflow_dispatch:                 # manual trigger
  push:
    branches: ["main"]

jobs:
  metrics:
    name: Generate Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      # ── 1. STATS + LANGUAGES (donut panels) ─────────────────────────
      - name: "Stats · Languages · Commit Activity"
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NuRichter
          filename: assets/metrics/metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 500
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 0%
          config_timezone: Asia/Jakarta
          config_display: large
          config_padding: 6%, 10% +0
          committer_message: "chore(metrics): update languages [skip ci]"
          output_action: commit
          dryrun: false

      # ── 2. BASE STATS + ISOCALENDAR (contribution heatmap) ──────────
      - name: "Base Stats · Calendar"
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NuRichter
          filename: assets/metrics/metrics.base.svg
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Jakarta
          config_padding: 6%, 10% +0
          committer_message: "chore(metrics): update base stats [skip ci]"
          output_action: commit
          dryrun: false

      # ── 3. ACHIEVEMENTS / BADGES ─────────────────────────────────────
      - name: "Achievements · Badges"
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NuRichter
          filename: assets/metrics/metrics.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
          config_timezone: Asia/Jakarta
          committer_message: "chore(metrics): update achievements [skip ci]"
          output_action: commit
          dryrun: false

      # ── 4. ACTIVITY TIMELINE ─────────────────────────────────────────
      - name: "Activity Timeline"
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: NuRichter
          filename: assets/metrics/metrics.activity.svg
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 10
          plugin_activity_days: 30
          plugin_activity_filter: push, issue, release, review, ref/create
          config_timezone: Asia/Jakarta
          committer_message: "chore(metrics): update activity [skip ci]"
          output_action: commit
          dryrun: false
