name: Generate Snake

# Generates the contribution snake animation referenced by the profile README.
# Runs every 12 hours (so the snake stays current) and on manual dispatch.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Diary Life palette: aged gold ink on charcoal (dark), bronze on bone paper (light).
          outputs: |
            dist/diary-snake.svg?color_snake=#87611F&color_dots=#E6DAC0,#D2BF94,#B39A66,#87611F,#5A4118
            dist/diary-snake-dark.svg?color_snake=#E8DAB8&color_dots=#191713,#3A3226,#71644D,#A8874D,#C8A15D

      - name: Push generated assets to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
