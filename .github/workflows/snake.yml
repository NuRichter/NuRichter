name: Generate Snake

# Generates the contribution snake animation referenced by the profile README.
# Runs every 12 hours (so the snake stays current) and on manual dispatch.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Two output variants — light + dark — matched to the KazuScara palette.
          # Dark variant uses Wanderer-purple snake on a near-void background;
          # light variant uses Kazuha-crimson on a paper-white field.
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#C73E3A&color_dots=#EDE5DD,#F0C0BC,#D85A56,#A04948,#6B2421
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C0A0E8&color_dots=#1E1432,#3A1A2E,#6F4F8A,#8B6FBF,#C0A0E8

      - name: Push generated assets to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
